<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 580px;
    }

    /* HEADER */
    .header {
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100%{opacity:1}
      50%{opacity:.4}
    }

    .header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    #online-count {
      font-size: 12px;
      margin-left: auto;
      opacity: 0.8;
    }

    /* JOIN */
    #join-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 32px;
    }

    #username-input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    #join-btn {
      width: 100%;
      padding: 10px;
      background: #4facfe;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #join-btn:hover {
      background: #3b82f6;
    }

    /* CHAT */
    #chat-screen {
      flex: 1;
      display: none;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f9fafb;
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-name {
      font-size: 11px;
      color: #666;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
    }

    .me .bubble {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
    }

    .other .bubble {
      background: #e5e7eb;
      color: #111;
    }

    .msg-time {
      font-size: 10px;
      color: #999;
    }

    .system-msg {
      text-align: center;
      font-size: 12px;
      color: #888;
    }

    /* INPUT */
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #f3f4f6;
    }

    #msg-input {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ddd;
    }

    #send-btn {
      width: 42px;
      height: 42px;
      background: #4facfe;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    #send-btn:hover {
      background: #3b82f6;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">
    <div class="status-dot"></div>
    <h2>WebSocket Chat</h2>
    <span id="online-count">online</span>
  </div>

  <div id="join-screen">
    <h3>Masuk Chat</h3>
    <input id="username-input" placeholder="Username...">
    <button id="join-btn">Masuk</button>
  </div>

  <div id="chat-screen">
    <div id="messages"></div>

    <div class="input-area">
      <input id="msg-input" placeholder="Tulis pesan...">
      <button id="send-btn">➤</button>
    </div>
  </div>
</div>

<script>
  let ws;
  let myUsername = '';

  const joinScreen = document.getElementById('join-screen');
  const chatScreen = document.getElementById('chat-screen');
  const messages = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  document.getElementById('join-btn').addEventListener('click', joinChat);

  function joinChat() {
    const name = document.getElementById('username-input').value.trim();
    if (!name) return alert('Isi username!');

    myUsername = name;

    ws = new WebSocket('ws://localhost:3000');

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'join', username: myUsername }));
      joinScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'system') {
        addSystemMsg(data.text);
      } else {
        const isMe = data.username === myUsername;
        addBubble(data.username, data.text, data.time, isMe);
      }
    };
  }

  sendBtn.onclick = sendMessage;
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    ws.send(JSON.stringify({ type: 'chat', text }));
    msgInput.value = '';
  }

  function addBubble(username, text, time, isMe) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (isMe ? 'me' : 'other');

    if (!isMe) {
      const name = document.createElement('div');
      name.className = 'msg-name';
      name.innerText = username;
      wrap.appendChild(name);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerText = text;

    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.innerText = time || '';

    wrap.appendChild(bubble);
    wrap.appendChild(timeEl);

    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
  }

  function addSystemMsg(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.innerText = text;
    messages.appendChild(div);
  }
</script>

</body>
</html>
